---
- name: firewall | Fail if distro is not supported
  ansible.builtin.fail:
    msg: "Distribution '{{ ansible_facts['distribution'] }}' is not supported. Supported: Debian, Ubuntu"
  when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

- name: firewall | Install dependencies
  ansible.builtin.apt:
    name:
      - iptables
      - ipset
      - ipset-persistent
      - netfilter-persistent
    state: present
    update_cache: true

- name: firewall | Enable netfilter-persistent service
  ansible.builtin.systemd:
    name: netfilter-persistent
    enabled: true

- name: firewall | Set WAN interface fact
  ansible.builtin.set_fact:
    firewall_wan_interface_actual: "{{ firewall_wan_interface | default(ansible_facts['default_ipv4']['interface'], true) }}"
    firewall_wan_ip_actual: "{{ firewall_wan_ip | default(ansible_facts['default_ipv4']['address'], true) }}"

- name: firewall | Build whitelist
  ansible.builtin.set_fact:
    firewall_whitelist_combined: >-
      {{
        firewall_whitelist_ips +
        ([firewall_wireguard_network] if (firewall_wireguard_enabled and firewall_wireguard_whitelist) else [])
      }}

- name: firewall | Display network configuration
  ansible.builtin.debug:
    msg: |
      WAN Interface: {{ firewall_wan_interface_actual }}
      WAN IP: {{ firewall_wan_ip_actual }}
      TCP Ports: {{ firewall_public_ports_tcp | join(', ') }}
      UDP Ports: {{ firewall_public_ports_udp | join(', ') if firewall_public_ports_udp | length > 0 else 'none' }}
      WireGuard: {{ 'enabled (' + firewall_wireguard_interface + ')' if firewall_wireguard_enabled else 'disabled' }}
      Whitelist: {{ firewall_whitelist_combined | join(', ') if firewall_whitelist_combined | length > 0 else 'none' }}

## Older role versions logged bans / portscans to /var/log/ipset via rsyslog.
- name: firewall | Remove rsyslog config of older role versions
  ansible.builtin.file:
    path: /etc/rsyslog.d/10-ipset.conf
    state: absent
  notify: Restart rsyslog

- name: firewall | Remove logs and logrotate config of older role versions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/logrotate.d/ipset-iptables
    - /var/log/ipset

- name: firewall | Create fail2ban jail.d directory
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: firewall_fail2ban_disable_sshd | bool or firewall_fail2ban_ignoreip | bool

- name: firewall | Disable fail2ban sshd jail
  ansible.builtin.template:
    src: fail2ban-zz-sshd-off.local.j2
    dest: /etc/fail2ban/jail.d/zz-sshd-off.local
    owner: root
    group: root
    mode: "0644"
  notify: Reload fail2ban
  when: firewall_fail2ban_disable_sshd | bool

- name: firewall | Remove fail2ban sshd override
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/zz-sshd-off.local
    state: absent
  notify: Reload fail2ban
  when: not firewall_fail2ban_disable_sshd | bool

- name: firewall | Deploy fail2ban ignoreip
  ansible.builtin.template:
    src: fail2ban-zz-ignoreip.local.j2
    dest: /etc/fail2ban/jail.d/zz-ignoreip.local
    owner: root
    group: root
    mode: "0644"
  notify: Reload fail2ban
  when: firewall_fail2ban_ignoreip | bool

- name: firewall | Deploy iptables rules script
  ansible.builtin.template:
    src: iptables-rules.sh.j2
    dest: /usr/local/sbin/iptables-rules.sh
    owner: root
    group: root
    mode: "0700"
  notify: Apply and save iptables rules

- name: firewall | Display completion message
  ansible.builtin.debug:
    msg: |
      Firewall configured successfully!

      Allowed TCP: {{ firewall_public_ports_tcp | join(', ') }}
      Allowed UDP: {{ firewall_public_ports_udp | join(', ') if firewall_public_ports_udp | length > 0 else 'none' }}
      Whitelist: {{ firewall_whitelist_combined | join(', ') if firewall_whitelist_combined | length > 0 else 'none' }}
      {% if firewall_wireguard_enabled %}
      WireGuard: {{ firewall_wireguard_interface }} (port {{ firewall_wireguard_port_udp }}/udp)
      WireGuard NAT: {{ firewall_wireguard_network }} -> {{ firewall_wan_interface_actual }}
      {% endif %}

      SSH rate limit: {{ firewall_ssh_ratelimit ~ ' (burst ' ~ firewall_ssh_burst ~ ')' if firewall_ssh_ratelimit | length > 0 else 'off' }}

      Useful commands:
        ipset -L WHITELIST                  # View whitelisted IPs
        iptables -vnL INPUT | grep hashlimit  # SSH rate-limit drops
        netfilter-persistent save           # Save current rules
