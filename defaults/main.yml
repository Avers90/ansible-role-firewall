---
## Network interface (auto-detected if empty)
firewall_wan_interface: ""
firewall_wan_ip: ""

## Public TCP ports — open to everyone on the internet (SSH always recommended)
firewall_public_ports_tcp:
  - 22

## Public UDP ports — open to everyone on the internet
firewall_public_ports_udp: []

## Whitelist IPs (full access, never banned)
## These IPs bypass all filtering and are never added to ban lists
firewall_whitelist_ips: []

## Port variables carry the protocol as a suffix (_tcp / _udp).

## WireGuard integration
firewall_wireguard_enabled: false
firewall_wireguard_port_udp: "{{ wireguard_port | default('51820') }}"
firewall_wireguard_interface: "{{ wireguard_interface | default('wg0') }}"
firewall_wireguard_network: "{{ wireguard_address | default('10.0.0.0/24') | ansible.utils.ipaddr('network/prefix') }}"

## TCP MSS clamp for traffic forwarded through the WireGuard interface.
## 0 = disabled (no rules rendered). When > 0, SYN packets in both directions
## get their MSS lowered to this value — never raised. Fixes PMTUD blackholes
## (tunnel up, small pages load, large ones hang) on LTE / PPPoE / double NAT
## paths where ICMP "fragmentation needed" is filtered. 1240 = inner MTU 1280.
## Server-side only, applies to new TCP connections, no client changes needed.
firewall_wireguard_mss: 0

## Extra public UDP ports redirected to firewall_wireguard_port_udp
## (nat PREROUTING REDIRECT). The server keeps listening on its real port; these
## are additional entry points, e.g. [443] for carriers that drop non-standard
## UDP ports. No INPUT rule needed: filter sees the packet already rewritten to
## firewall_wireguard_port_udp. Clients opt in by changing only the Endpoint port.
## A port equal to firewall_wireguard_port_udp is skipped, so one list
## (e.g. [443, 51820, 27015]) fits hosts listening on any of these ports.
firewall_wireguard_extra_ports_udp: []

## Source IP for tunnel traffic leaving the WAN interface.
## "" = MASQUERADE (the kernel picks the primary address of the WAN interface).
## An IP = SNAT --to-source <IP>: pins the egress address on multi-IP hosts so
## clients can connect to one address while their traffic leaves from another,
## and the egress does not silently move if the address order changes.
firewall_wireguard_snat_source: ""

## Automatically add WireGuard network to whitelist
firewall_wireguard_whitelist: true

## SSH rate limit: NEW connections per source IP to firewall_ssh_port above
## this rate are dropped (iptables hashlimit, e.g. "6/min"). "" = off.
## Whitelisted IPs never hit it (rule sits after the WHITELIST ACCEPT).
firewall_ssh_ratelimit: ""
firewall_ssh_burst: 10
firewall_ssh_port: 22

## fail2ban side files (jail.d/zz-*.local, read after package and installer files).
## Written whether or not fail2ban is installed yet, so the order of installing
## fail2ban and running this role does not matter.
## Disable the stock [sshd] jail — use when firewall_ssh_ratelimit covers SSH.
firewall_fail2ban_disable_sshd: false
## [DEFAULT] ignoreip = loopback + the firewall whitelist + firewall_fail2ban_ignoreip_extra.
## fail2ban inserts its rules at the top of INPUT, above the WHITELIST ACCEPT,
## so without this a jail can ban a whitelisted IP.
firewall_fail2ban_ignoreip: false
firewall_fail2ban_ignoreip_extra: []

## ICMP (ping) settings
firewall_allow_ping: true

## Restricted TCP ports — open only to specific source IPs (not exposed publicly)
## Format: [{port: 27015, sources: ["1.2.3.4", "5.6.7.8"]}]
firewall_restricted_ports_tcp: []

## Close inbound IPv6 (ip6tables: INPUT/FORWARD DROP, OUTPUT ACCEPT; only
## replies, loopback, ICMPv6 and DHCPv6 replies allowed). Without it the IPv4
## rules above do not cover IPv6 at all. Default off: enabling flushes ip6tables.
firewall_ipv6_block: false

## With firewall_ipv6_block: also accept the WireGuard port over IPv6 and
## REDIRECT firewall_wireguard_extra_ports_udp to it (ip6tables nat). Clients
## opt in with Endpoint = [v6-addr]:port. Only for hosts with a public v6 address.
firewall_ipv6_allow_wireguard: false

## Additional custom rules (advanced)
firewall_custom_rules: []
